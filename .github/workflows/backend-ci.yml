name: backend-ci

defaults:
  run:
    working-directory: server

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - staging
      - main
    paths:
      - 'server/**'
      - '!*.md'
      - '!build/**'
      - '!.gitignore'
  push:
    branches:
      - staging
      - main
    paths:
      - 'server/**'
      - '!*.md'
      - '!build/**'
      - '!.gitignore'

jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - run: gleam check
      - run: gleam format --check src test

  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test

  docker-build-push:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}_server

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true

  docker-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      glimmer_server:
        image: ghcr.io/${{ github.repository }}_server
        env:
          ADDRESS: "0.0.0.0"
          PORT: "8000"
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7
      - name: Test container image
        run: |
          curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          sudo dpkg -i hurl_4.0.0_amd64.deb
          hurl --test ../tests
